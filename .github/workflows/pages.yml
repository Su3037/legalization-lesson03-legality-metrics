name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  check-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Exercise the deployed site (Playwright + axe-core)
        env:
          SITE_URL: https://su3037.github.io/legalization-lesson03-legality-metrics/
        run: |
          sleep 20
          node tests/e2e/site.mjs build/e2e-deployed.json
          node tests/browser-python.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-deployed
          path: build/e2e-deployed.json
