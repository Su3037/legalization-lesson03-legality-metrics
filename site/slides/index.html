<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课件 · 合法吗？</title>
<link rel="stylesheet" href="{{BASE}}assets/site.css"></head>
<body><!--NAV-->
<main id="main" class="page">
<h1>课件（12 页）</h1>
<p class="lead">每页下面是讲稿备注。图里的结论都由同一个检查器判定。<a href="{{BASE}}slides/out/legality-metrics-slides.pdf" download>下载 PDF</a> · <a href="{{BASE}}slides/out/deck.html">HTML 版</a></p>
<div class="toolbar"><button id="prev">上一页</button><span id="pos" aria-live="polite"></span><button id="next">下一页</button></div>
<div class="slide-view"><img id="img" alt=""></div>
<div class="slide-notes"><b>备注：</b><span id="notes"></span></div>
<noscript><p>需要 JavaScript 翻页；也可以直接下载 PDF。</p></noscript>
</main>
<!--FOOT-->
<script type="module">
const B = "{{BASE}}";
const notes = await (await fetch(B + "slides/out/notes.json")).json();
let i = Math.max(0, Math.min(notes.length - 1, (+location.hash.slice(1) || 1) - 1));
const show = () => {
  const n = notes[i];
  const img = document.getElementById("img");
  img.src = `${B}slides/out/slide-${String(n.n).padStart(2, "0")}.png`;
  img.alt = `第 ${n.n} 页：${n.title}`;
  document.getElementById("notes").textContent = n.notes;
  document.getElementById("pos").textContent = `${n.n} / ${notes.length} · ${n.title}`;
  history.replaceState(null, "", "#" + n.n);
};
document.getElementById("prev").onclick = () => { i = Math.max(0, i - 1); show(); };
document.getElementById("next").onclick = () => { i = Math.min(notes.length - 1, i + 1); show(); };
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("prev").click(); });
show();
</script>
</body></html>
