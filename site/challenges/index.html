<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>挑战与概念检测 · 合法吗？</title>
<link rel="stylesheet" href="{{BASE}}assets/site.css"></head>
<body><!--NAV-->
<main id="main" class="page">
<h1>挑战与概念检测</h1>
<p class="lead">10 个挑战，每个针对一个常见误区。摆放题按你摆出的布局判分：用同一个检查器判断是否合法，再看指标是否达到要求，所以正确答案不止一个。</p>
<p class="hint">进度保存在这个浏览器里（不会上传）。“看了解析之后完成”和“独立完成”会分开记录。</p>
<div id="challenges"><p class="hint">载入中…（需要 JavaScript）</p></div>

<h2 id="inventory">概念检测（8 题）</h2>
<p>同一组题，学之前做一次（前测），学完再做一次（后测），可以看出哪些想法变了。每题一个误区，答完会下载一个 JSON 文件；页面不会把答案发到任何地方。</p>
<div class="toolbar" role="group" aria-label="选择前测或后测">
<a class="tag" href="#inventory-pre" id="go-pre">前测</a><a class="tag" href="#inventory-post" id="go-post">后测</a>
</div>
<div id="inventory-form"></div>
</main>
<!--FOOT-->
<script type="module">
import { startChallenges, startInventory } from "{{BASE}}src/lab/challenges.js";
await startChallenges(document.getElementById("challenges"), { base: "{{BASE}}" });
const inv = () => {
  const phase = location.hash === "#inventory-post" ? "post" : "pre";
  startInventory(document.getElementById("inventory-form"), { phase });
  document.getElementById("inventory-form").insertAdjacentHTML("afterbegin", `<p class="note-box">当前是<strong>${phase === "post" ? "后测" : "前测"}</strong>。</p>`);
  if (location.hash.startsWith("#inventory")) document.getElementById("inventory").scrollIntoView();
};
inv();
addEventListener("hashchange", inv);
if (location.hash && !location.hash.startsWith("#inventory")) document.querySelector(location.hash)?.scrollIntoView();
window.challengesReady = true;
</script>
</body></html>
